<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forehead Stretcher</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23111'/><path d='M30 20 L50 10 L70 20 M30 80 L50 90 L70 80' stroke='%23b9ff66' stroke-width='8' fill='none' stroke-linecap='round'/><rect x='35' y='30' width='30' height='40' fill='none' stroke='%23b9ff66' stroke-width='6' rx='5'/></svg>">
    <style>
        :root { --bg: #f4f4f0; --fg: #111; --panel: #ffffff; --border: #111; --btn: #b9ff66; --cvs-bg: #eee; --track: #e0e0e0; }
        [data-theme="dark"] { --bg: #121212; --fg: #f4f4f0; --panel: #1e1e1e; --border: #f4f4f0; --btn: #ff79c6; --cvs-bg: #333; --track: #444; }
        * { box-sizing: border-box; scrollbar-width: none; -ms-overflow-style: none; }
        *::-webkit-scrollbar { display: none; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; background-color: var(--bg); color: var(--fg); display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem; margin: 0; min-height: 100vh; transition: background-color 0.2s, color 0.2s; }
        .header-wrap { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem; }
        h1 { font-size: clamp(2rem, 8vw, 3.5rem); font-weight: 900; letter-spacing: -2px; margin: 0; text-align: center; }
        #tBtn { background: var(--panel); color: var(--fg); border: 3px solid var(--border); font-size: 1.5rem; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; box-shadow: 4px 4px 0px var(--border); transition: transform 0.1s; display: flex; align-items: center; justify-content: center; }
        .sub-text { font-size: 1.1rem; font-weight: 500; margin-bottom: 2rem; text-align: center; border-bottom: 3px solid var(--border); padding-bottom: 0.5rem; display: inline-block; }
        .pikachu-panel { background: var(--panel); border: 3px solid var(--border); border-radius: 8px; box-shadow: 8px 8px 0px var(--border); padding: 1.5rem; margin-bottom: 2rem; width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 1.2rem; }
        label { display: flex; flex-direction: column; font-weight: 800; font-size: 0.85rem; text-transform: uppercase; gap: 8px; }
        input[type="range"] { -webkit-appearance: none; width: 100%; background: transparent; margin: 15px 0; cursor: pointer; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 24px; width: 24px; border-radius: 50%; background: #ff4747; border: 3px solid var(--border); margin-top: -9px; box-shadow: 2px 2px 0px var(--border); }
        input[type="range"]::-webkit-slider-runnable-track { width: 100%; height: 8px; background: var(--track); border: 2px solid var(--border); border-radius: 4px; }
        .btn-row { display: flex; gap: 1rem; margin-top: 1rem; }
        .btn { font-family: inherit; background: var(--btn); color: #111; border: 3px solid var(--border); padding: 0.8rem 1rem; font-weight: 900; text-transform: uppercase; cursor: pointer; box-shadow: 4px 4px 0px var(--border); border-radius: 4px; flex: 1; text-align: center; }
        .btn-alt { background: var(--panel); color: var(--fg); flex: 0.5; }
        .cvs-wrap { border: 3px solid var(--border); background: var(--panel); box-shadow: 8px 8px 0px var(--border); border-radius: 8px; padding: 0.5rem; width: 100%; max-width: 800px; display: none; margin-bottom: 2rem; overflow: hidden; }
        .cvs-wrap.active { display: block; }
        canvas { display: block; width: 100%; height: auto; border: 2px solid var(--border); background: var(--cvs-bg); }
    </style>
</head>
<body>
    <div class="header-wrap">
        <svg width="50" height="50" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" rx="20" fill="#111"/><path d="M30 20 L50 10 L70 20 M30 80 L50 90 L70 80" stroke="#b9ff66" stroke-width="8" fill="none" stroke-linecap="round"/><rect x="35" y="30" width="30" height="40" fill="none" stroke="#b9ff66" stroke-width="6" rx="5"/></svg>
        <h1>Forehead Stretcher</h1>
        <button id="tBtn">🌙</button>
    </div>
    <p class="sub-text">Expand your mind (literally).</p>
    <div class="pikachu-panel">
        <label>1. Select an Image <input type="file" id="fileIn" accept="image/*"></label>
        <label>2. Forehead Starting Point <input type="range" id="ySlider" min="0" max="100" value="25"></label>
        <label>3. Vertical Stretch <input type="range" id="sSlider" min="1" max="5" step="0.1" value="1"></label>
        <label>4. Alien Mode (Width) <input type="range" id="wSlider" min="0.5" max="3" step="0.1" value="1"></label>
        <label style="flex-direction:row; align-items:center; cursor:pointer;"><input type="checkbox" id="guideCb" checked style="margin-right:10px;"> Show guide line</label>
        <div class="btn-row">
            <button class="btn btn-alt" id="rstBtn" disabled>Reset</button>
            <button class="btn" id="dlBtn" disabled>💾 Save Image</button>
        </div>
    </div>
    <div class="cvs-wrap" id="wrap"><canvas id="cvs"></canvas></div>
    <script>
        const fileIn = document.getElementById('fileIn'), ySlider = document.getElementById('ySlider'), sSlider = document.getElementById('sSlider'), wSlider = document.getElementById('wSlider'), guideCb = document.getElementById('guideCb'), dlBtn = document.getElementById('dlBtn'), rstBtn = document.getElementById('rstBtn'), tBtn = document.getElementById('tBtn'), cvs = document.getElementById('cvs'), wrap = document.getElementById('wrap'), ctx = cvs.getContext('2d');
        let pikachu = null, sW = 0, sH = 0, isCoolingDown = false;
        tBtn.addEventListener('click', () => { const mode = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; document.body.setAttribute('data-theme', mode); tBtn.innerText = mode === 'dark' ? '☀️' : '🌙'; });
        fileIn.addEventListener('change', e => { const f = e.target.files[0]; if(!f) return; if(f.size > 10*1024*1024) { alert("File too big!"); return; } const r = new FileReader(); r.onload = ev => { const img = new Image(); img.onload = () => { pikachu = img; sW = img.width > 800 ? 800 : img.width; sH = img.height * (sW/img.width); dlBtn.disabled = rstBtn.disabled = false; nuke(); wrap.classList.add('active'); }; img.src = ev.target.result; }; r.readAsDataURL(f); });
        const nuke = () => { sSlider.value = 1; wSlider.value = 1; ySlider.value = 25; render(false); };
        function render(isExp) {
            if (!pikachu) return;
            const sm = parseFloat(sSlider.value), wm = parseFloat(wSlider.value), cutY = sH * (parseFloat(ySlider.value)/100);
            cvs.width = sW; cvs.height = (cutY * sm) + (sH - cutY);
            ctx.clearRect(0,0,cvs.width,cvs.height);
            const tw = cvs.width * wm, tx = (cvs.width - tw)/2, oC = pikachu.height * (parseFloat(ySlider.value)/100);
            ctx.drawImage(pikachu, 0,0,pikachu.width, oC, tx, 0, tw, cutY * sm);
            ctx.drawImage(pikachu, 0, oC, pikachu.width, pikachu.height - oC, 0, cutY * sm, cvs.width, sH - cutY);
            if (guideCb.checked && !isExp) { ctx.beginPath(); ctx.moveTo(0, cutY*sm); ctx.lineTo(cvs.width, cutY*sm); ctx.strokeStyle = '#ff4747'; ctx.lineWidth = 3; ctx.setLineDash([10,8]); ctx.stroke(); }
        }
        [ySlider, sSlider, wSlider, guideCb].forEach(el => el.addEventListener('input', () => render(false)));
        rstBtn.addEventListener('click', nuke);
        dlBtn.addEventListener('click', () => { if(isCoolingDown) return; isCoolingDown = true; render(true); const a = document.createElement('a'); a.download = 'mega-forehead.png'; a.href = cvs.toDataURL('image/png'); a.click(); render(false); setTimeout(() => isCoolingDown = false, 3000); });
    </script>
</body>
</html>
